name: Build and push MailFlow images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # manual trigger button in the Actions tab

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: ver
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mailflow-${{ matrix.component }}:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/mailflow-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max